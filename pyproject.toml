[project]
name = "steelmind-ai-v1"
version = "1.0.0"
description = "Human-reviewed prompt-assisted material planning and rectangular plate-packing MVP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Internal evaluation prototype; add a project license before public redistribution" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "streamlit>=1.40,<2.0",
  "pandas>=2.1,<3.0",
  "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
